openapi: 3.0.3
info:
  title: Distribution Management System API
  version: 1.0.0
  description: |
    Partial OpenAPI definition for the Distribution Management System.
    This file includes core auth and order/customer/rep endpoints and representative schemas.
servers:
  - url: http://localhost:5000
    description: Local development server
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: payload
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        userId:
          type: string
        role:
          type: string
    OrderItem:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        customerId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        notes:
          type: string
    OrderDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        status:
          type: string
        totalAmount:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
    PagedResult_OrderDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderDto'
        totalCount:
          type: integer
paths:
  /api/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/auth/register:
    post:
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
      responses:
        '200':
          description: Registration response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/auth/refresh-token:
    post:
      summary: Refresh JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/orders:
    get:
      summary: Get all orders (Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        '200':
          description: Paged orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/orders/{id}:
    get:
      summary: Get order by id (Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      summary: Approve order (Admin)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Order approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/rep/orders:
    post:
      summary: Create order (Rep)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      summary: Get rep orders
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Paged orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/customer/orders:
    post:
      summary: Create order (Customer)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      summary: Get customer orders
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Paged orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/customer/orders/{id}/track:
    get:
      summary: Track order (Customer)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order tracking data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/reps:
    get:
      summary: Get all reps (Admin)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Paged reps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/admin/customers:
    get:
      summary: Get all customers (Admin)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Paged customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
security:
  - BearerAuth: []

x-note: "This is a representative OpenAPI document — expand schemas using DTOs from DistributionSystem.Application.DTOs for full contract coverage."